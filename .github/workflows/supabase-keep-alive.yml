name: Supabase Keep-Alive

on:
  schedule:
    # Executa a cada 3 dias às 08:00 UTC (05:00 no Brasil)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permite disparar manualmente pelo GitHub se desejar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Endpoint
        run: |
          curl -s -X GET "https://futebolaolive.vercel.app/api/keep-alive" || echo "Falha temporária ao pingar Vercel"
